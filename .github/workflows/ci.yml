name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude ragvault-python

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install maturin pytest numpy
      - run: maturin build --release --out dist
      - run: pip install dist/*.whl
      - run: python -m pytest tests/python -q
      - name: CLI smoke test
        run: |
          mkdir -p /tmp/docs && echo "# Policy" > /tmp/docs/p.md
          ragvault init /tmp/kb
          ragvault sync /tmp/kb /tmp/docs
          ragvault query /tmp/kb "policy" -k 1
          ragvault doctor /tmp/kb

  # Real framework adapters exercised against pinned upstream versions, so a
  # breaking upstream change fails CI instead of silently rotting. The
  # roundtrip tests importorskip when a framework is absent; here they run.
  integrations:
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install maturin pytest numpy
      - run: maturin build --release --out dist
      - run: pip install dist/*.whl
      - name: Install pinned framework versions
        run: |
          pip install \
            "langchain-core==0.3.29" \
            "llama-index-core==0.12.11" \
            "haystack-ai==2.9.0" \
            "dspy-ai==2.5.43"
      - name: Run real integration roundtrips
        run: python -m pytest tests/python/test_tuning_and_integrations.py -q

  wheels:
    name: wheels-${{ matrix.name }}
    needs: [rust, python]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
            manylinux: auto
          - name: linux-aarch64
            runner: ubuntu-latest
            target: aarch64
            manylinux: auto
          - name: macos-arm64
            runner: macos-14
            target: aarch64
            manylinux: "off"
          - name: windows-x86_64
            runner: windows-latest
            target: x64
            manylinux: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl
      # Clean-install smoke test: fresh venv, install only the built wheel,
      # then exercise the non-negotiable open→add→retrieve path. Emulated
      # Linux aarch64 wheels are not runnable on the x86_64 runner, so the
      # smoke test is skipped there (the build itself still gates).
      - name: Clean-install smoke test (POSIX)
        if: runner.os != 'Windows' && matrix.name != 'linux-aarch64'
        shell: bash
        run: |
          python -m venv /tmp/rv-smoke
          /tmp/rv-smoke/bin/pip install --upgrade pip
          /tmp/rv-smoke/bin/pip install dist/*.whl
          /tmp/rv-smoke/bin/python - <<'PY'
          import tempfile, ragvault
          with tempfile.TemporaryDirectory() as d:
              kb = ragvault.open(d)
              kb.add([{"id": "a", "text": "cancellation and refund policy"},
                      {"id": "b", "text": "shipping schedule details"}])
              result = kb.retrieve("refund policy", k=1, token_budget=200)
              assert result.chunks[0].document_id == "a", result.chunks
              assert result.context and result.citations
              kb.close()
          print("smoke ok:", ragvault.__version__)
          PY
      - name: Clean-install smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv $env:TEMP\rv-smoke
          & "$env:TEMP\rv-smoke\Scripts\pip.exe" install --upgrade pip
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          & "$env:TEMP\rv-smoke\Scripts\pip.exe" install "$wheel"
          & "$env:TEMP\rv-smoke\Scripts\python.exe" -c @"
          import tempfile, ragvault
          with tempfile.TemporaryDirectory() as d:
              kb = ragvault.open(d)
              kb.add([{'id': 'a', 'text': 'cancellation and refund policy'},
                      {'id': 'b', 'text': 'shipping schedule details'}])
              result = kb.retrieve('refund policy', k=1, token_budget=200)
              assert result.chunks[0].document_id == 'a', result.chunks
              assert result.context and result.citations
              kb.close()
          print('smoke ok:', ragvault.__version__)
          "@
